startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      vadyuApiKey:
        type: string
        description: Optional for storefront preview & catalog; Bearer API key (vadyu_live_...) from https://vadyu.com/dashboard for video rendering.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['vadyu-mcp.mjs'],
      env: config && config.vadyuApiKey ? { VADYU_API_KEY: config.vadyuApiKey } : {}
    })
